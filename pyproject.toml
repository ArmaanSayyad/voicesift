[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repair-bench"
version = "0.1.0"
description = "Deterministic audio/event feasibility harness"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "soxr", "soundfile", "psutil", "fastapi", "uvicorn", "pydantic", "huggingface_hub>=1.0,<2", "pyarrow>=20,<26"]

[project.optional-dependencies]
test = ["pytest", "hypothesis", "httpx"]

[project.scripts]
repair-bench = "repair_bench.cli:main"
repair-bench-serve = "repair_bench.api:main"
curation-serve = "repair_bench.curation.api:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
