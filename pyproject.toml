[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repair-bench"
version = "0.1.0"
description = "Deterministic audio/event feasibility harness"
requires-python = ">=3.12"
dependencies = ["numpy", "scipy", "soxr", "soundfile", "psutil"]

[project.optional-dependencies]
test = ["pytest", "hypothesis"]

[project.scripts]
repair-bench = "repair_bench.cli:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
